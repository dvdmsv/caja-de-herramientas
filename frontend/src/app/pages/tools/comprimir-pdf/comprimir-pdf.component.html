<app-tool-page slug="comprimir-pdf">

  <app-file-queue
    [items]="archivos"
    [multiple]="false"
    [deshabilitado]="ocupado"
    ayuda="Arrastra tu PDF aquí o haz clic para elegirlo"
    (agregados)="alAgregar($event)"
    (itemsChange)="alCambiarLista()">
  </app-file-queue>

  <fieldset class="mt-4">
    <legend class="h6">Nivel de compresión</legend>
    <div class="row g-2">
      @for (opcion of niveles; track opcion) {
        <div class="col-12 col-sm-4">
          <input type="radio" class="btn-check" name="nivel" [id]="'nivel-' + opcion.id"
            [checked]="nivel === opcion.id" [disabled]="ocupado"
            (change)="elegirNivel(opcion.id)">
          <label class="btn btn-outline-primary w-100 text-start" [for]="'nivel-' + opcion.id">
            <span class="d-block fw-semibold">{{ opcion.nombre }}</span>
            <small class="text-body-secondary">{{ opcion.detalle }}</small>
          </label>
        </div>
      }
    </div>
    <p class="form-text">
      La compresión trabaja sobre las imágenes del documento; el texto no pierde nitidez.
    </p>
  </fieldset>

  <app-tool-controls [pagina]="pagina" accion="Comprimir PDF" icono="bi-file-earmark-zip">
  </app-tool-controls>

  <app-result-list [archivos]="resultados" [resumen]="resumen"></app-result-list>

</app-tool-page>
