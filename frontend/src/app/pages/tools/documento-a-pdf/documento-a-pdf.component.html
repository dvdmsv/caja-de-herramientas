<app-tool-page slug="documento-a-pdf">

  <app-file-queue
    [items]="archivos"
    [deshabilitado]="ocupado"
    ayuda="Arrastra aquí tus documentos de Word, Excel, PowerPoint, OpenDocument, RTF o texto"
    (agregados)="alAgregar($event)"
    (itemsChange)="alCambiarLista()">
  </app-file-queue>

  <app-tool-controls [pagina]="pagina" accion="Convertir a PDF" icono="bi-filetype-pdf">
  </app-tool-controls>

  <p class="text-body-secondary small mt-3 mb-0">
    <i class="bi bi-info-circle me-1"></i>
    La conversión conserva estilos, tablas, imágenes y saltos de página. Una hoja de cálculo
    sale paginada como la imprimiría LibreOffice (con sus áreas de impresión, si las tiene) y una
    presentación, con una diapositiva por página.
  </p>

  <app-result-list [archivos]="resultados" [resumen]="resumen" nombreZip="pdfs.zip">
  </app-result-list>

</app-tool-page>
