<app-tool-page slug="comprimir-imagen">

  <app-file-queue
    [items]="archivos"
    [deshabilitado]="ocupado"
    ayuda="Arrastra tus imágenes aquí o haz clic para elegirlas"
    (agregados)="alAgregar($event)"
    (itemsChange)="alCambiarLista()">
  </app-file-queue>

  <div class="row g-4 mt-1">
    <div class="col-12 col-md-6">
      <label for="calidad" class="form-label h6 mb-1">
        Calidad: <span class="fw-normal">{{ calidad }} %</span>
      </label>
      <input type="range" class="form-range" id="calidad" min="20" max="95" step="5"
        [disabled]="ocupado" [(ngModel)]="calidad" (change)="alCambiarLista()">
      <p class="form-text mt-0">{{ descripcionCalidad }}</p>
    </div>

    <div class="col-12 col-md-6">
      <label for="tamano" class="form-label h6 mb-1">Tamaño máximo</label>
      <select class="form-select" id="tamano" [disabled]="ocupado"
        [(ngModel)]="ladoMaximo" (change)="alCambiarLista()">
        @for (tamano of tamanos; track tamano) {
          <option [ngValue]="tamano.valor">{{ tamano.nombre }}</option>
        }
      </select>
      <p class="form-text">Se aplica al lado más largo, manteniendo la proporción.</p>
    </div>
  </div>

  <app-tool-controls [pagina]="pagina" accion="Comprimir imágenes" icono="bi-images">
  </app-tool-controls>

  <app-result-list [archivos]="resultados" [resumen]="resumen"
  nombreZip="imagenes-comprimidas.zip"></app-result-list>

</app-tool-page>
