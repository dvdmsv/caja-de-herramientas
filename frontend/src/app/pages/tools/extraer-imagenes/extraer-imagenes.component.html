<app-tool-page slug="extraer-imagenes">

  <app-file-queue
    [items]="archivos"
    [multiple]="false"
    [deshabilitado]="ocupado"
    ayuda="Arrastra el PDF del que quieras sacar las imágenes"
    (agregados)="alAgregar($event)"
    (itemsChange)="alCambiarLista()">
  </app-file-queue>

  <fieldset class="mt-4">
    <legend class="h6">Formato de salida</legend>
    <div class="row g-2">
      @for (opcion of formatos; track opcion) {
        <div class="col-12 col-sm-4">
          <input type="radio" class="btn-check" name="formato" [id]="'fmt-' + opcion.id"
            [checked]="formato === opcion.id" [disabled]="ocupado"
            (change)="elegirFormato(opcion.id)">
          <label class="btn btn-outline-primary w-100 text-start" [for]="'fmt-' + opcion.id">
            <span class="d-block fw-semibold">{{ opcion.nombre }}</span>
            <small class="text-body-secondary">{{ opcion.detalle }}</small>
          </label>
        </div>
      }
    </div>
    <p class="form-text">
      «Como están» las saca sin tocarlas: es lo más fiel y lo más rápido.
    </p>
  </fieldset>

  <div class="row g-4 mt-1">
    <div class="col-12 col-md-6">
      <label for="lado" class="form-label h6 mb-1">
        Tamaño mínimo: <span class="fw-normal">{{ ladoMinimo }} píxeles</span>
      </label>
      <input type="range" class="form-range" id="lado" min="0" max="500" step="25"
        [disabled]="ocupado" [(ngModel)]="ladoMinimo" (change)="alCambiarLista()">
      <p class="form-text mt-0">
        Un PDF de texto lleva docenas de fragmentos diminutos —viñetas, filetes de
        las tablas— que aquí no le importan a nadie. Baja el mínimo si buscas un
        icono pequeño.
      </p>
    </div>
  </div>

  <app-tool-controls [pagina]="pagina" accion="Extraer las imágenes" icono="bi-card-image">
  </app-tool-controls>

  <app-result-list [archivos]="resultados" [resumen]="resumen" nombreZip="imagenes.zip">
  </app-result-list>

</app-tool-page>
