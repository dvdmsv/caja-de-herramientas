<app-tool-page slug="unir-pdf">

  <app-file-queue
    [items]="archivos"
    [ordenable]="true"
    [deshabilitado]="ocupado"
    ayuda="Arrastra tus PDF aquí o haz clic para elegirlos"
    (agregados)="alAgregar($event)"
    (itemsChange)="alCambiarLista()">
  </app-file-queue>

  @if (archivos.length > 1) {
    <p class="text-body-secondary small mt-3 mb-0">
      <i class="bi bi-info-circle me-1"></i>
      Arrastra los archivos para cambiar el orden en el que se unirán.
    </p>
  }

  <app-tool-controls [pagina]="pagina" accion="Combinar PDF" icono="bi-file-earmark-plus">
  </app-tool-controls>

  <app-result-list [archivos]="resultados" [resumen]="resumen"></app-result-list>

</app-tool-page>
