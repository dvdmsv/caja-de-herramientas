<div class="fondo"></div>
<form class="dialogo" role="dialog" aria-modal="true" aria-labelledby="titulo-secreto" autocomplete="off"
  (input)="alEscribir()" (ngSubmit)="guardar()">
  <div class="dialogo__cabeza">
    <h2 class="h5 mb-0" id="titulo-secreto">{{ secreto ? 'Editar el secreto' : 'Nuevo secreto' }}</h2>
    <button type="button" class="btn-close boton-cerrar" aria-label="Cerrar" (click)="pedirCierre()"></button>
  </div>

  <div class="dialogo__cuerpo">
    <div class="mb-3">
      <label for="secreto-nombre" class="form-label mb-1">Nombre</label>
      <input #primero type="text" class="form-control" id="secreto-nombre" name="nombre" required maxlength="200"
        spellcheck="false" autocomplete="off" [(ngModel)]="ficha.nombre">
    </div>
    <div class="mb-3">
      <label for="secreto-usuario" class="form-label mb-1">Usuario <span class="text-body-secondary">(opcional)</span></label>
      <input type="text" class="form-control" id="secreto-usuario" name="usuario" maxlength="300"
        spellcheck="false" autocapitalize="off" autocomplete="off" [(ngModel)]="ficha.usuario">
    </div>
    <div class="mb-3">
      <label for="secreto-valor" class="form-label mb-1">Contraseña o secreto</label>
      <div class="d-flex gap-1">
        <input class="form-control secreto-valor" id="secreto-valor" name="secreto" required
          [type]="verSecreto ? 'text' : 'password'"
          spellcheck="false" autocapitalize="off" autocomplete="new-password" [(ngModel)]="ficha.secreto">
        <button type="button" class="btn btn-outline-secondary flex-shrink-0 boton-icono"
          [attr.aria-pressed]="verSecreto" aria-label="Ver lo escrito" [title]="verSecreto ? 'Ocultar' : 'Ver'"
          (click)="verSecreto = !verSecreto">
          <i class="bi" [class.bi-eye]="!verSecreto" [class.bi-eye-slash]="verSecreto" aria-hidden="true"></i>
        </button>
        <button type="button" class="btn btn-outline-primary flex-shrink-0" (click)="generar()">
          <i class="bi bi-shuffle me-1" aria-hidden="true"></i>Generar
        </button>
      </div>
      @if (generador; as opciones) {
        <div class="generador mt-2">
          <label for="secreto-longitud" class="form-label small mb-0">
            Longitud: <strong>{{ opciones.longitud }}</strong>
          </label>
          <input type="range" class="form-range" id="secreto-longitud" name="longitud"
            [min]="longitudMinima" [max]="longitudMaxima" step="1"
            [(ngModel)]="opciones.longitud" (input)="generar()">
          <div class="d-flex flex-wrap gap-3">
            @for (familia of familias; track familia.clave) {
              <div class="form-check mb-0">
                <input class="form-check-input" type="checkbox" [id]="'secreto-' + familia.clave" [name]="familia.clave"
                  [disabled]="esLaUltima(familia.clave)" [(ngModel)]="opciones[familia.clave]" (change)="generar()">
                <label class="form-check-label small" [for]="'secreto-' + familia.clave">{{ familia.etiqueta }}</label>
              </div>
            }
          </div>
        </div>
      }
    </div>
    <div class="mb-3">
      <label for="secreto-web" class="form-label mb-1">Web <span class="text-body-secondary">(opcional)</span></label>
      <input type="text" class="form-control" id="secreto-web" name="web" maxlength="500" inputmode="url"
        spellcheck="false" autocapitalize="off" autocomplete="off" [(ngModel)]="ficha.web">
    </div>
    <div class="mb-1">
      <label for="secreto-notas" class="form-label mb-1">Notas <span class="text-body-secondary">(opcional)</span></label>
      <textarea class="form-control" id="secreto-notas" name="notas" rows="3"
        spellcheck="false" autocapitalize="off" autocomplete="off" [(ngModel)]="ficha.notas"></textarea>
    </div>
  </div>

  <div class="dialogo__pie">
    <button type="button" class="btn btn-outline-secondary" (click)="pedirCierre()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="!completa || guardando">Guardar</button>
  </div>
</form>
