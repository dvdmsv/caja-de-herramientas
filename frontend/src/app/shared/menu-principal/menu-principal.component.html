<ul class="navbar-nav menu">
  @for (grupo of grupos; track grupo) {
    <li class="nav-item seccion"
      (pointerenter)="alEntrar($event, grupo.categoria)" (pointerleave)="alSalir($event)">
      <button type="button" class="seccion__boton"
        [class.seccion__boton--activa]="esActiva(grupo)"
        [attr.aria-expanded]="seccionAbierta === grupo.categoria"
        [attr.aria-controls]="identificador(grupo.categoria)"
        (click)="alternar($event, grupo.categoria)">
        {{ grupo.categoria }}
        <i class="bi bi-chevron-down seccion__flecha" aria-hidden="true"></i>
      </button>
      <div class="panel" [id]="identificador(grupo.categoria)"
        [class.panel--abierto]="seccionAbierta === grupo.categoria">
        <div class="panel__interior">
          @for (herramienta of grupo.herramientas; track herramienta) {
            <a class="nav-link herramienta"
              [routerLink]="rutaDe(herramienta)" routerLinkActive="herramienta--activa"
              (click)="alNavegar()">
              <span class="pastilla pastilla--sm pastilla--{{ clave(grupo) }}" aria-hidden="true">
                <i class="bi {{ herramienta.icono }}"></i>
              </span>
              <span>
                <span class="herramienta__nombre">{{ herramienta.nombre }}</span>
                <span class="herramienta__descripcion">{{ herramienta.descripcion }}</span>
              </span>
            </a>
          }
        </div>
      </div>
    </li>
  }
</ul>
