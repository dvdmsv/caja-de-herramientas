@if (pagina.progreso >= 0) {
  <div class="progress mt-3" role="progressbar"
    aria-label="Progreso de la subida" [attr.aria-valuenow]="pagina.progreso"
    aria-valuemin="0" aria-valuemax="100" style="height: 1.25rem">
    <div class="progress-bar progress-bar-striped progress-bar-animated"
    [style.width.%]="pagina.progreso">{{ pagina.progreso }}%</div>
  </div>
}

<div class="d-flex flex-wrap gap-2 mt-4">
  <button type="button" class="btn btn-primary" [disabled]="!pagina.listo" (click)="pagina.ejecutar()"
    [attr.aria-describedby]="pagina.motivoBloqueo ? 'motivo-bloqueo' : null">
    @if (pagina.procesando) {
      <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
    }
    @if (!pagina.procesando) {
      <i class="bi {{ icono }} me-1"></i>
    }
    {{ accion }}
  </button>

  @if (pagina.archivos.length > 0) {
    <button type="button" class="btn btn-outline-secondary"
      [disabled]="pagina.ocupado" (click)="pagina.empezarDeCero()">
      Empezar de cero
    </button>
  }

  @if (pagina.pendientes.length > 0 && !pagina.ocupado) {
    <button type="button" class="btn btn-outline-warning ms-auto"
      (click)="pagina.reintentar()">
      <i class="bi bi-arrow-clockwise me-1"></i>Reintentar la subida
    </button>
  }
</div>

@if (pagina.motivoBloqueo; as motivo) {
  <p id="motivo-bloqueo" class="form-text mt-2 mb-0 d-flex align-items-center gap-1" aria-live="polite">
    <i class="bi bi-info-circle" aria-hidden="true"></i>{{ motivo }}
  </p>
}
