<!-- Una hoja de papel también en modo oscuro: la tinta es la que se estampa en
     el PDF, oscura, y tiene que verse sobre lo que será, papel blanco. Con el
     fondo del tema oscuro no se distinguía (1,1:1 de contraste). -->
<div class="pizarra" data-bs-theme="light">
  <canvas #lienzo
    (pointerdown)="alPulsar($event)"
    (pointermove)="alMover($event)"
    (pointerup)="alSoltar($event)"
    (pointercancel)="alSoltar($event)"
  (pointerleave)="alSoltar($event)"></canvas>
  @if (vacia) {
    <p class="pista">Firma aquí con el ratón, el dedo o el lápiz</p>
  }
</div>

<div class="d-flex flex-wrap align-items-center gap-2 mt-2">
  <button type="button" class="btn btn-primary btn-sm" [disabled]="vacia || deshabilitado"
    (click)="usar()">
    <i class="bi bi-check-lg me-1"></i>Usar esta firma
  </button>
  <button type="button" class="btn btn-outline-secondary btn-sm" [disabled]="vacia || deshabilitado"
    (click)="deshacer()">
    <i class="bi bi-arrow-counterclockwise me-1"></i>Deshacer
  </button>
  <button type="button" class="btn btn-outline-secondary btn-sm" [disabled]="vacia || deshabilitado"
    (click)="borrar()">
    Borrar
  </button>

  @if (hayLapiz) {
    <div class="form-check ms-auto mb-0">
      <input class="form-check-input" type="checkbox" id="solo-lapiz" [(ngModel)]="soloLapiz">
      <label class="form-check-label small" for="solo-lapiz">
        Sólo lápiz <span class="text-body-secondary">(ignora la mano apoyada)</span>
      </label>
    </div>
  }
</div>
