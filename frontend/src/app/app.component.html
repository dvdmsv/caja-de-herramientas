@if ((pantallaCompleta | async) === false) {
  <nav class="navbar navbar-expand-lg border-bottom bg-body sticky-top">
    <div class="container">
      <a class="navbar-brand marca" routerLink="/">
        <span class="marca__puntos" aria-hidden="true">
          <span class="marca__punto marca__punto--pdf"></span>
          <span class="marca__punto marca__punto--imagenes"></span>
          <span class="marca__punto marca__punto--documentos"></span>
        </span>
        <span class="marca__texto">Caja de herramientas</span>
      </a>
      <div class="d-flex align-items-center gap-1 order-lg-last ms-auto ms-lg-2">
        <app-uso-sesion></app-uso-sesion>
        <button type="button" class="btn btn-link boton-tema" (click)="tema.alternar()"
          [attr.aria-label]="'Tema: ' + etiquetaTema + '. Pulsa para cambiarlo'"
          [title]="'Tema: ' + etiquetaTema">
          <i class="bi {{ iconoTema }}" aria-hidden="true"></i>
        </button>
        <button class="navbar-toggler border-0" type="button" (click)="menuAbierto = !menuAbierto"
          aria-controls="menuPrincipal" [attr.aria-expanded]="menuAbierto"
          aria-label="Abrir el menú">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
      <div class="navbar-collapse menu-plegable" id="menuPrincipal" [class.abierto]="menuAbierto">
        <app-menu-principal (navegado)="menuAbierto = false"></app-menu-principal>
      </div>
    </div>
  </nav>
}

<!-- El visor se pinta a pantalla completa; el resto, dentro del marco. -->
@if ((pantallaCompleta | async) === false) {
  <main class="container py-4 py-md-5">
    <router-outlet></router-outlet>
  </main>
} @else {
  <router-outlet></router-outlet>
}


@if ((pantallaCompleta | async) === false) {
  <footer class="border-top py-3 mt-auto">
    <div class="container text-center text-body-secondary small">
      <p class="mb-1">Tus archivos se borran del servidor 2 horas después de tu última actividad. · {{ anio }}</p>
      <p class="mb-0 creditos">
        Hecha por <a [href]="perfilAutor" target="_blank" rel="noopener">dvdmsv</a>
        · <a routerLink="/acerca-de">Acerca de</a>
      </p>
    </div>
  </footer>
}
