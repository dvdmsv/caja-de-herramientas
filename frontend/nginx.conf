# Cuántos trabajos pesados admite una misma IP a la vez. No es seguridad —esto
# vive en una red de confianza—: es que una ráfaga de pestañas no llene la cola y
# deje al resto esperando. 10m de zona son unas 160.000 direcciones.
limit_conn_zone $binary_remote_addr zone=trabajos:10m;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # El DNS interno de Docker, y los destinos por variable. Los dos detalles
    # importan: con el nombre escrito directo, nginx lo resuelve **al arrancar**
    # —y no levanta si un servicio aún no está— y se queda con esa IP para
    # siempre, así que al recrear un contenedor (cada despliegue lo hace) seguiría
    # llamando a la IP vieja y devolviendo 502. Con variable resuelve en cada
    # petición y relee cada diez segundos.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $servicio_web web;
    set $servicio_ligeros ligeros;
    set $servicio_pesados pesados;

    # Comunes a todo lo que va por proxy: los `location` de la API sólo tienen
    # que decir a quién.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Cuándo entró la petición, en segundos con milisegundos. El backend la
    # descarta con un 503 si ha esperado demasiado en la cola: trabajar para
    # alguien que ya se ha ido sólo hace esperar más al siguiente.
    proxy_set_header X-Request-Start $msec;

    # Archivos grandes: sin límite de buffer ni cortes por tiempo de proceso.
    client_max_body_size 200M;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Comprimir. Sin esto la primera carga son 646 kB en vez de 149, y el worker
    # de pdf.js que usan el visor y firmar pasa de 1233 kB a 364.
    #
    # `gzip_static` sirve los .gz que deja preparados el Dockerfile: ya vienen
    # comprimidos al máximo y aquí no se gasta CPU en recomprimirlos en cada
    # petición. `gzip` a secas queda de reserva para lo que no tenga .gz al lado,
    # que es sobre todo lo que responde la API.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml;

    # --- reparto de la API entre los tres servicios -----------------------
    #
    # Ver `backend/app.py` para qué hace cada uno. Aquí sólo se decide quién
    # atiende qué, y el orden importa: una expresión regular gana al prefijo
    # `^~` sólo si se declara **antes**, así que las rutas ligeras van primero o
    # se las come `/api/tools/`.
    #
    # Lo común a los tres va a nivel de servidor (abajo), que se hereda.

    # Auxiliares baratas: vistas previas, inspecciones, listas de formatos y la
    # preparación de la firma. Llegan seguidas y no deben hacer cola detrás de
    # un OCR. **Al añadir una ruta auxiliar nueva hay que añadirla aquí.**
    #
    # Ojo con el orden y con `^~`: nginx elige primero el prefijo más largo, y
    # si ese prefijo lleva `^~` se queda con él sin mirar las expresiones
    # regulares, vayan antes o después. Por eso `/api/tools/` es un prefijo
    # normal: para que estas expresiones tengan su oportunidad. `/api/` sí lleva
    # `^~`, que ahí es lo que se quiere.
    location ~ ^/api/tools/[a-z0-9-]+/(previsualizar|inspeccionar|formatos|preparar|apariencia|autofirma|certificado)$ {
        proxy_pass http://$servicio_ligeros:5000;
    }

    # Las dos herramientas que no reciben archivos y cuestan poco.
    location ~ ^/api/tools/(generar-qr|crear-certificado)$ {
        proxy_pass http://$servicio_ligeros:5000;
    }

    # El resto del trabajo: un proceso desechable por petición.
    location /api/tools/ {
        proxy_pass http://$servicio_pesados:5000;

        # Demasiados trabajos de la misma IP: se rechaza con 429 y no con el 503
        # de serie, para no chocar con el 503 que el propio backend devuelve
        # cuando descarta una petición que ha esperado demasiado.
        limit_conn trabajos 3;
        limit_conn_status 429;
        error_page 429 = @cola_llena;

        # Si el trabajo muere (se pasó de memoria, de CPU o de tiempo), el
        # frontend tiene que recibir JSON, no la página de error de nginx.
        proxy_intercept_errors on;
        error_page 502 504 = @trabajo_caido;
    }

    # Subidas, descargas, ZIP, sesión y salud.
    location ^~ /api/ {
        proxy_pass http://$servicio_web:5000;
    }

    location @cola_llena {
        default_type application/json;
        return 429 '{"error":"Ya tienes tres trabajos en marcha. Espera a que termine uno y vuelve a intentarlo."}';
    }

    location @trabajo_caido {
        default_type application/json;
        # 503 y no 502: para quien llama, esto es "ahora no puedo", no "el
        # servidor de detrás está roto".
        return 503 '{"error":"El trabajo no ha podido terminar: puede que el archivo sea demasiado grande o demasiado complejo para este servidor. Prueba con uno más pequeño."}';
    }

    # nginx no lleva la extensión .mjs en su tabla de tipos y la serviría como
    # binario; el navegador rechaza cualquier módulo que no llegue declarado
    # como JavaScript. Lo necesita el worker de pdf.js, que usa "firmar".
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    # Los recursos con hash en el nombre no cambian nunca.
    location ~* \.(js|css|woff2?|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El resto lo resuelve el router de Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
