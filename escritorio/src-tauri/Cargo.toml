[package]
name = "caja-de-herramientas"
version = "0.1.0"
description = "Caja de herramientas para PDF e imágenes, como aplicación de Windows"
license = "AGPL-3.0-or-later"
repository = "https://github.com/dvdmsv/caja-de-herramientas"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-opener = "2.5.5"
tauri-plugin-dialog = "2.7.3"
# Con el TLS de Windows (Schannel) y no con rustls: usa los certificados y el
# proxy del sistema, como cualquier otro programa del equipo, y se ahorra ring,
# que necesita compilar C. Sin `zip`: en Windows se descarga el instalador tal
# cual.
tauri-plugin-updater = { version = "2.12.0", default-features = false, features = ["native-tls", "system-proxy"] }
percent-encoding = "2.3.2"
getrandom = "0.3"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
win32job = "2.0.3"

[profile.release]
# Un ejecutable más pequeño y sin símbolos: esto sólo arranca el backend y
# enseña la ventana, no hay nada que depurar en producción.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
