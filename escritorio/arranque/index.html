<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caja de herramientas</title>
  <!--
    Lo que se ve mientras arranca el backend: la ventana se abre enseguida y
    esto ocupa los segundos que tarda Python en cargar sus bibliotecas. Cuando
    el backend dice LISTO, Tauri navega a él y esta página desaparece.

    Es de Tauri, no de la aplicación: no carga Angular ni nada de fuera. Si el
    backend no llega a arrancar, main.rs llama a `mostrarError`.
  -->
  <style>
    :root {
      --fondo: #f6f7f9; --texto: #1f2230; --suave: #5b6070;
      --rojo: #d0341f; --morado: #7c3aed; --verde: #0f7a6b;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fondo: #15171f; --texto: #e8e9ee; --suave: #a3a7b5; }
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; background: var(--fondo); color: var(--texto);
      font: 15px/1.5 system-ui, "Segoe UI", sans-serif; padding: 0 16px; box-sizing: border-box;
    }
    main { text-align: center; max-width: 34rem; }
    .puntos { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
    .puntos span { width: 14px; height: 14px; border-radius: 50%; animation: latido 1.2s infinite ease-in-out; }
    .puntos span:nth-child(1) { background: var(--rojo); }
    .puntos span:nth-child(2) { background: var(--morado); animation-delay: .15s; }
    .puntos span:nth-child(3) { background: var(--verde); animation-delay: .3s; }
    @keyframes latido { 0%, 80%, 100% { transform: scale(.6); opacity: .5 } 40% { transform: scale(1); opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .puntos span { animation: none; } }
    h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 4px; }
    p { color: var(--suave); margin: 0; }
    .error .puntos { display: none; }
    .error h1 { color: var(--rojo); }
    pre {
      text-align: left; white-space: pre-wrap; word-break: break-word; font-size: 12px;
      color: var(--suave); margin-top: 16px; max-height: 40vh; overflow: auto;
    }
  </style>
</head>
<body>
  <main id="principal">
    <div class="puntos" aria-hidden="true"><span></span><span></span><span></span></div>
    <h1 id="titulo">Abriendo la caja de herramientas…</h1>
    <p id="detalle">La primera vez tarda un poco más.</p>
  </main>
  <script>
    // Si pasa un minuto sin que el backend conteste, al menos que se sepa que
    // sigue intentándolo: un antivirus revisando cada archivo la primera vez
    // puede tardar eso.
    setTimeout(function () {
      if (!document.body.classList.contains('error')) {
        document.getElementById('detalle').textContent =
          'Está tardando más de lo normal. Si es la primera vez que la abres, ' +
          'puede que el antivirus esté revisando los archivos.';
      }
    }, 60000);

    window.mostrarError = function (detalle, registro) {
      document.body.classList.add('error');
      document.getElementById('titulo').textContent = 'No se ha podido abrir la aplicación';
      document.getElementById('detalle').textContent = registro
        ? 'El registro está en ' + registro + '.' : '';
      if (detalle) {
        var pre = document.createElement('pre');
        pre.textContent = detalle;
        document.getElementById('principal').appendChild(pre);
      }
    };
  </script>
</body>
</html>
