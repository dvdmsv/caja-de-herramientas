services:
  backend:
    restart: unless-stopped
    build:
      context: ./backend
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      - FLASK_ENV=production
      # Estas variables se pasan **vacías** si no las defines, y vacío significa
      # "no dicho": entonces manda el valor por defecto del código, que para los
      # workers y el OCR se calcula mirando los núcleos y la memoria que tenga
      # esta máquina. Así no hay que escribir un `.env` para desplegar bien.
      #
      # Si aquí se pusieran valores fijos, pisarían ese cálculo. Lo que hay que
      # tocar se toca en el `.env`, que está explicado en `.env.example`.
      - MAX_CONTENT_LENGTH_MB=${MAX_CONTENT_LENGTH_MB:-}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-}
      - MAX_CONCURRENT_CONVERSIONS=${MAX_CONCURRENT_CONVERSIONS:-}
      - OCR_TIMEOUT_SECONDS=${OCR_TIMEOUT_SECONDS:-}
      - OCR_JOBS=${OCR_JOBS:-}
      - OCR_OPTIMIZE=${OCR_OPTIMIZE:-}
      - PDF_TO_WORD_TIMEOUT_SECONDS=${PDF_TO_WORD_TIMEOUT_SECONDS:-}
      - DOC_TO_PDF_TIMEOUT_SECONDS=${DOC_TO_PDF_TIMEOUT_SECONDS:-}
      - CONVERSION_QUEUE_TIMEOUT_SECONDS=${CONVERSION_QUEUE_TIMEOUT_SECONDS:-}
      - SESSION_TTL_MINUTES=${SESSION_TTL_MINUTES:-}
      - CLEANUP_INTERVAL_MINUTES=${CLEANUP_INTERVAL_MINUTES:-}
      - TSA_URL=${TSA_URL:-}
      - TSA_TIMEOUT_SECONDS=${TSA_TIMEOUT_SECONDS:-}
    # Un tope, no una reserva: si algo se desmadra muere este contenedor y lo
    # reinicia Docker, en vez de que el kernel se ponga a matar procesos por toda
    # la máquina y se lleve por delante a lo que haya al lado.
    #
    # 1,5 GB da margen de sobra: medido, el worker en reposo ronda los 300 MB y
    # el trabajo más pesado añade unos 145 MB. Lo que puede sumar de verdad son
    # varios workers y varias conversiones a la vez, y eso lo decides con
    # `GUNICORN_WORKERS` y `MAX_CONCURRENT_CONVERSIONS`.
    mem_limit: ${BACKEND_MEM_LIMIT:-1536m}
    # Los dos topes son **la entrada del autodimensionado**, no sólo una
    # protección: el backend le pregunta al cgroup qué tiene y se ajusta a lo que
    # aquí le pongas, no a lo que tenga la máquina. Por eso van los dos por
    # variable — dejar los núcleos escritos a fuego le mentía al cálculo en
    # cuanto el servidor no tenía exactamente cuatro.
    cpus: ${BACKEND_CPUS:-4.0}
    networks:
      - app-network

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
    mem_limit: 256m
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
