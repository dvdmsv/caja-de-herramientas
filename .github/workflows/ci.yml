name: CI

# Se comprueba lo mismo que comprobaría alguien que clona el repositorio por
# primera vez: instalar desde el lockfile, compilar, pasar los tests y construir
# las imágenes. Si esto pasa, el proyecto se levanta en una máquina limpia.
on:
  push:
    branches: [master]
    # Lo que sólo es de la aplicación de Windows lo prueba escritorio.yml.
    paths-ignore: ['escritorio/**', '.github/workflows/escritorio.yml', '.github/workflows/publicar-escritorio.yml']
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (compilar y probar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # La versión sale del .nvmrc, para que no haya dos sitios que
          # mantener. Angular 22 exige 22.22.3 como mínimo.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` y no `npm install`: falla si el lockfile y el package.json no
      # concuerdan, que es justo lo que se quiere detectar aquí.
      - run: npm ci

      - name: Los iconos usados están en la fuente recortada
        run: npm run iconos

      - run: npm run build

      # Vitest sobre jsdom: sin navegador, así que no hace falta pantalla.
      - run: npm test

      # La ruta la tiene escrita a mano el Dockerfile: si el empaquetador
      # cambiara la estructura de salida, la imagen se construiría vacía y no lo
      # detectaría ningún test.
      - name: La salida está donde el Dockerfile la espera
        run: |
          test -f dist/merge-pdf/browser/index.html
          test -n "$(find dist -name 'pdf.worker.min.mjs')"
          test -f dist/merge-pdf/browser/assets/autofirma/autoscript.js

  imagenes:
    name: Imágenes y pasada por las herramientas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Construir es lo que valida el despliegue de verdad: el backend instala
      # LibreOffice y Tesseract, y el frontend compila con `npm ci` dentro.
      - name: Construir backend y frontend
        run: docker compose build

      - name: La capa de npm se reutiliza al cambiar HTML y se renueva al cambiar el lockfile
        run: bash scripts/comprobar-cache-docker.sh

      # Y levantarla es lo único que prueba lo que los tests no pueden: OCR,
      # LibreOffice, WeasyPrint y los tres servicios repartiéndose el trabajo.
      - name: Levantar la pila completa
        run: |
          cat > "$RUNNER_TEMP/compose.env" <<'EOF'
          COMPARE_TIMEOUT_SECONDS=181
          SESSION_PROTECTED_MINUTES=11
          EOF
          huella=$(sha256sum "$RUNNER_TEMP/compose.env")
          for intento in 1 2; do
            docker compose --env-file "$RUNNER_TEMP/compose.env" up -d --remove-orphans --wait --wait-timeout 300 web ligeros pesados frontend || { docker compose logs --tail 40; exit 1; }
          done
          test "$(sha256sum "$RUNNER_TEMP/compose.env")" = "$huella"
          docker compose exec -T web python -c 'import config; assert config.SESION_PROTEGIDA_SEGUNDOS == 660'
          docker compose exec -T pesados python -c 'from api.tools.comparar_pdf import PLAZO_EN_PROCESO; assert PLAZO_EN_PROCESO == 181'
          docker compose ps

      - name: Las sondas de los pools siguen respondiendo con los workers ocupados
        run: |
          for servicio in ligeros pesados; do
            contenedor=$(docker compose ps -q "$servicio")
            sonda=$(docker inspect --format '{{json .Config.Healthcheck.Test}}' "$contenedor")
            docker compose exec -T "$servicio" python - "$sonda" <<'PY'
          import json, os, pathlib, signal, subprocess, sys
          tipo, *sonda = json.loads(sys.argv[1])
          assert tipo == "CMD"
          hijos = pathlib.Path("/proc/1/task/1/children")
          def workers_del_maestro():
              return set(map(int, hijos.read_text().split())) - {os.getpid()}
          workers = workers_del_maestro()
          assert workers, "Gunicorn no ha arrancado sus workers"
          pausados = []
          try:
              for pid in workers:
                  os.kill(pid, signal.SIGSTOP)
                  pausados.append(pid)
              subprocess.run(sonda, check=True, timeout=5)
          finally:
              for pid in pausados:
                  os.kill(pid, signal.SIGCONT)
          assert workers == workers_del_maestro()
          PY
          done

      - name: nginx revalida AutoFirma y conserva el JavaScript versionado
        shell: bash
        run: |
          base=http://localhost:8081
          portada=$(curl -fsS --retry 5 --retry-connrefused "$base/")
          principal=$(grep -oE 'src="main-[A-Za-z0-9_-]+\.js"' <<< "$portada" | cut -d'"' -f2)
          test -n "$principal"
          curl -fsSI "$base/assets/autofirma/autoscript.js" | grep -i '^cache-control: no-cache'
          curl -fsSI "$base/$principal" | grep -i '^cache-control: .*immutable'

      - name: Pasada por todas las herramientas
        run: python3 scripts/barrido.py

      - name: Recoger
        if: always()
        run: docker compose down -v

  backend:
    name: Backend (arranca y pasa los tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # ocrmypdf exige 3.11 o superior; la imagen usa 3.12.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Los tests no tocan OCR, LibreOffice ni WeasyPrint: necesitan la imagen y
      # son lentos. Cubren los límites, las cuotas, el reparto entre servicios y
      # unir/dividir, que es donde un fallo se nota tarde.
      - name: Tests
        run: python -m pytest tests/ -q

      # Que la aplicación levante y registre sus rutas descarta un import roto o
      # un blueprint sin registrar, que es el error típico al añadir una
      # herramienta.
      - name: La aplicación arranca y registra sus rutas
        run: |
          python -c "
          import app
          rutas = [str(r) for r in app.app.url_map.iter_rules()]
          print(f'{len(rutas)} rutas registradas')
          assert len(rutas) > 30, 'faltan rutas: algún blueprint no se ha registrado'
          "
