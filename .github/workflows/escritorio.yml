name: Escritorio (Windows)

# La aplicación de escritorio, en un Windows de verdad. Vive sólo en la rama
# `escritorio`: la CI de la web (`ci.yml`) no se entera de esto.
#
# **No se instala nada en el sistema.** Los programas externos salen de
# `escritorio/vendor/`, que es lo que irá dentro del instalador, y el backend los
# encuentra solo (`escritorio.usar_vendor`). Si alguno se estuviera tomando del
# sistema sin querer, aquí fallaría, porque en el sistema no hay ninguno: es la
# misma situación que el equipo de quien lo instale.
on:
  push:
    branches: [escritorio]
  workflow_dispatch:

jobs:
  backend:
    name: Backend en Windows
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # Las descargas pesan ~500 MB (LibreOffice son 373). Se guardan por la
      # suma del script: cambiar una versión en él invalida la caché.
      - uses: actions/cache@v4
        with:
          path: escritorio/descargas
          key: descargas-${{ hashFiles('escritorio/scripts/traer-dependencias.ps1') }}

      - name: Preparar vendor
        timeout-minutes: 30
        run: ./escritorio/scripts/traer-dependencias.ps1

      - name: Lo que hay en vendor responde
        run: |
          $vendor = (Resolve-Path escritorio\vendor).Path
          $env:TESSDATA_PREFIX = "$vendor\tesseract\tessdata"
          & "$vendor\tesseract\tesseract.exe" --version
          & "$vendor\tesseract\tesseract.exe" --list-langs
          & "$vendor\gs\bin\gswin64c.exe" --version
          & "$vendor\libreoffice\program\soffice.exe" --version
          Get-ChildItem "$vendor\letras" | Select-Object -ExpandProperty Name
          Get-Content "$vendor\VERSIONES.txt"

      - name: Dependencias de Python
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-escritorio.txt -r requirements-dev.txt

      - name: Tests
        id: tests
        continue-on-error: true
        working-directory: backend
        run: python -m pytest tests/ -q -p no:cacheprovider -rf

      # Temporal: en Windows el mínimo de «Comprimir PDF» y la compresión real
      # difieren en un byte. Esto enseña dónde.
      - name: Diagnóstico de Comprimir PDF
        continue-on-error: true
        working-directory: backend
        run: python ..\escritorio\scripts\diagnostico_comprimir.py

      # Arrancar y barrer en el **mismo** paso: en Windows el runner mata todo
      # lo que un paso haya lanzado en cuanto ese paso acaba, así que un backend
      # arrancado en un paso ya no existe en el siguiente.
      - name: Pasada por todas las herramientas
        id: barrido
        continue-on-error: true
        working-directory: backend
        run: |
          $env:ESCRITORIO_TOKEN = 'ci'
          $env:ESCRITORIO_VENDOR = '..\escritorio\vendor'
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\datos"
          $backend = Start-Process python -ArgumentList 'escritorio.py' -NoNewWindow -PassThru `
            -RedirectStandardOutput "$env:RUNNER_TEMP\salida.txt" `
            -RedirectStandardError "$env:RUNNER_TEMP\errores.txt"
          foreach ($i in 1..120) {
            $linea = Get-Content "$env:RUNNER_TEMP\salida.txt" -ErrorAction SilentlyContinue |
              Select-String 'LISTO (\d+)'
            if ($linea -or $backend.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $linea) { throw 'El backend no ha dicho LISTO en un minuto.' }
          $env:BASE = "http://127.0.0.1:$($linea.Matches[0].Groups[1].Value)"
          $env:TOKEN = 'ci'
          # Sólo para la salida del barrido (✓ y ✗): la consola de Windows es
          # cp1252. Al backend no se le pone, para que se vea si depende de ello.
          $env:PYTHONIOENCODING = 'utf-8'
          python ..\scripts\barrido.py
          $resultado = $LASTEXITCODE
          Stop-Process -Id $backend.Id -Force -ErrorAction SilentlyContinue
          exit $resultado

      - name: Registro del backend
        if: always()
        run: Get-Content "$env:RUNNER_TEMP\errores.txt" -ErrorAction SilentlyContinue | Select-Object -Last 200

      # --- El mismo backend, empaquetado con PyInstaller -----------------------
      #
      # El paquete lleva dentro el Angular compilado (lo sirve él mismo), así
      # que hay que compilarlo antes.
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar el frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Empaquetar el backend
        working-directory: escritorio
        run: |
          pyinstaller backend.spec --noconfirm
          # Como quedará instalado: vendor\ al lado de la carpeta del backend.
          # Así se prueba también que el .exe lo encuentra solo, sin
          # ESCRITORIO_VENDOR.
          Move-Item vendor dist\vendor

      # Lo mismo que antes, pero contra el .exe: es lo que recibe quien lo
      # instala, y lo que sólo falla empaquetado —un plugin que se carga por
      # nombre, un archivo de datos que PyInstaller no ve— sólo sale aquí.
      - name: Pasada por todas las herramientas (empaquetado)
        id: empaquetado
        continue-on-error: true
        run: |
          $env:ESCRITORIO_TOKEN = 'ci'
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\datos-exe"
          $exe = 'escritorio\dist\merge-pdf-backend\merge-pdf-backend.exe'
          $backend = Start-Process $exe -NoNewWindow -PassThru `
            -RedirectStandardOutput "$env:RUNNER_TEMP\salida-exe.txt" `
            -RedirectStandardError "$env:RUNNER_TEMP\errores-exe.txt"
          foreach ($i in 1..240) {
            $linea = Get-Content "$env:RUNNER_TEMP\salida-exe.txt" -ErrorAction SilentlyContinue |
              Select-String 'LISTO (\d+)'
            if ($linea -or $backend.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $linea) { throw 'El backend empaquetado no ha dicho LISTO en dos minutos.' }
          $env:BASE = "http://127.0.0.1:$($linea.Matches[0].Groups[1].Value)"
          $env:TOKEN = 'ci'
          $env:PYTHONIOENCODING = 'utf-8'
          # La página también: el paquete sirve el frontend.
          $pagina = Invoke-WebRequest "$env:BASE/?t=ci" -SessionVariable s
          if ($pagina.Content -notmatch 'app-root') { throw 'El paquete no sirve el frontend.' }
          python scripts\barrido.py
          $resultado = $LASTEXITCODE
          Stop-Process -Id $backend.Id -Force -ErrorAction SilentlyContinue
          exit $resultado

      - name: Registro del backend empaquetado
        if: always()
        run: Get-Content "$env:RUNNER_TEMP\errores-exe.txt" -ErrorAction SilentlyContinue | Select-Object -Last 200

      # --- El instalador -------------------------------------------------------
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: escritorio/src-tauri

      - name: Compilar el instalador
        id: instalador
        working-directory: escritorio
        run: |
          npm ci
          npx tauri build
          $nsis = Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          '{0}: {1:N0} MB' -f $nsis.Name, ($nsis.Length / 1MB)
          "ruta=$($nsis.FullName)" >> $env:GITHUB_OUTPUT

      # Instalado de verdad, como lo haría alguien: que el backend arranque desde
      # la carpeta de instalación (encuentra vendor\ solo) y, sobre todo, que
      # **muera con la aplicación aunque se la cierre de golpe**. Es lo que
      # garantiza el job object de main.rs; sin él quedarían un Python y quizá
      # un LibreOffice vivos y sin ventana.
      - name: Instalar, abrir y cerrar de golpe
        id: instalado
        continue-on-error: true
        run: |
          $proceso = Start-Process '${{ steps.instalador.outputs.ruta }}' -ArgumentList '/S' -PassThru -Wait
          if ($proceso.ExitCode -ne 0) { throw "El instalador salió con $($proceso.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Caja de herramientas" -Filter 'caja-de-herramientas.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'No aparece la aplicación instalada.' }
          "Instalada en $($exe.DirectoryName)"
          $registro = "$env:LOCALAPPDATA\merge-pdf\backend.log"
          $app = Start-Process $exe.FullName -PassThru
          foreach ($i in 1..240) {
            if ((Test-Path $registro) -and (Select-String -Path $registro -Pattern 'listo con \d+ rutas' -Quiet)) { break }
            if ($app.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }
          Get-Content $registro -ErrorAction SilentlyContinue | Select-Object -Last 20
          if (-not (Select-String -Path $registro -Pattern 'listo con \d+ rutas' -Quiet)) {
            throw 'El backend de la aplicación instalada no ha arrancado.'
          }
          $backend = Get-Process merge-pdf-backend -ErrorAction SilentlyContinue
          if (-not $backend) { throw 'No hay proceso del backend.' }
          # De golpe, como el Administrador de tareas: sin dar ocasión a cerrar
          # nada por las buenas.
          Stop-Process -Id $app.Id -Force
          Start-Sleep -Seconds 3
          $vivo = Get-Process merge-pdf-backend -ErrorAction SilentlyContinue
          if ($vivo) { throw 'El backend sigue vivo después de matar la aplicación.' }
          'El backend ha muerto con la aplicación.'

          # «Abrir con…»: en la lista de los PDF, pero sin ser el predeterminado.
          $lista = Get-ItemProperty 'HKCU:\Software\Classes\.pdf\OpenWithProgids' -ErrorAction SilentlyContinue
          if (-not ($lista.PSObject.Properties.Name -contains 'CajaDeHerramientas.Archivo')) {
            throw 'La aplicación no aparece en «Abrir con…» de los PDF.'
          }
          $predeterminado = (Get-ItemProperty 'HKCU:\Software\Classes\.pdf' -ErrorAction SilentlyContinue).'(default)'
          if ($predeterminado -eq 'CajaDeHerramientas.Archivo') {
            throw 'La aplicación se ha hecho programa predeterminado de los PDF.'
          }
          'En «Abrir con…» de los PDF, sin ser el predeterminado.'

          # Y al desinstalar no queda nada de eso.
          $desinstalador = Join-Path $exe.DirectoryName 'uninstall.exe'
          Start-Process $desinstalador -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path 'HKCU:\Software\Classes\CajaDeHerramientas.Archivo') {
            throw 'Desinstalada, sigue registrada en «Abrir con…».'
          }
          if (Test-Path $exe.FullName) { throw 'Desinstalada, el ejecutable sigue ahí.' }
          'Desinstalada sin dejar rastro en el registro.'

      - uses: actions/upload-artifact@v4
        if: steps.instalador.outcome == 'success'
        with:
          name: instalador-windows
          path: ${{ steps.instalador.outputs.ruta }}
          # Ya va comprimido con LZMA: volver a comprimirlo sólo gasta tiempo.
          compression-level: 0
          retention-days: 14

      - name: Tamaño
        if: always()
        run: |
          foreach ($carpeta in Get-ChildItem escritorio\dist -Directory -ErrorAction SilentlyContinue) {
            $mb = (Get-ChildItem $carpeta.FullName -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
            '{0,-20} {1,6:N0} MB' -f $carpeta.Name, $mb
          }

      - name: Resultado
        if: always() && (steps.tests.outcome != 'success' || steps.barrido.outcome != 'success' || steps.empaquetado.outcome != 'success' || steps.instalado.outcome != 'success')
        run: |
          echo "Tests: ${{ steps.tests.outcome }} · Barrido: ${{ steps.barrido.outcome }} · Empaquetado: ${{ steps.empaquetado.outcome }} · Instalado: ${{ steps.instalado.outcome }}"
          exit 1
