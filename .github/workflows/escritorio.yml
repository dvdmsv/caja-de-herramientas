name: Escritorio (Windows)

# La aplicación de escritorio, en un Windows de verdad. Corre en cada push a
# `master` que toque código, también si sólo es de la web: la aplicación lleva el
# mismo backend y el mismo frontend, así que un cambio de la web que la rompa se
# ve en ese mismo push. La CI de la web (`ci.yml`) va aparte.
#
# **No se instala nada en el sistema.** Los programas externos salen de
# `escritorio/vendor/`, que es lo que irá dentro del instalador, y el backend los
# encuentra solo (`escritorio.usar_vendor`). Si alguno se estuviera tomando del
# sistema sin querer, aquí fallaría, porque en el sistema no hay ninguno: es la
# misma situación que el equipo de quien lo instale.
on:
  push:
    branches: [master]
    # Sólo lo que acaba dentro del instalador o lo prueba. Un cambio de
    # documentación, del Docker o de nginx no necesita 20 minutos de Windows.
    # (Con las etiquetas no se miran las rutas: siempre corre.)
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'escritorio/**'
      - 'scripts/barrido.py'
      - '.github/workflows/escritorio.yml'
      - '!**.md'
      - '!backend/Dockerfile'
      - '!backend/.dockerignore'
      - '!frontend/Dockerfile'
      - '!frontend/nginx.conf'
      - '!backend/gunicorn*.py'
    # Una versión: `v0.2.0`. Lo mismo que en cada push y, si todo pasa, se
    # publica en Releases (ver «Publicar la versión»).
    tags: ['v*']
  workflow_dispatch:
  # Lo llama el botón «Publicar versión de escritorio» (publicar-escritorio.yml)
  # con la etiqueta que acaba de crear. Hace falta llamarlo así y no esperar al
  # push de la etiqueta: lo que empuja un workflow con su token no dispara
  # otros workflows.
  workflow_call:
    inputs:
      etiqueta:
        description: La versión que compilar y publicar (v0.1.1)
        type: string
        required: true

# Un push nuevo a la rama cancela el anterior, que ya no interesa. Publicar no se
# cancela nunca, ni lo cancela un push: va en su propio grupo (el evento de la
# llamada del botón es workflow_dispatch, no push).
concurrency:
  group: escritorio-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  backend:
    name: Backend en Windows
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write   # para crear la release
      actions: read     # SignPath descarga el artefacto que se le pasa
    env:
      # La clave que firma las actualizaciones (no la de Authenticode): sin ella
      # `tauri build` no puede generar el .sig que el actualizador comprueba.
      # La pública está en tauri.conf.json.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # SignPath, para la firma de código. Hasta que esté dado de alta, vacío:
      # entonces el instalador sale sin firmar y Windows avisa al abrirlo.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      # Si esta ejecución publica (etiqueta o botón). Sólo entonces se empaqueta
      # como para repartir: LZMA y Rust con LTO. En cada push, el modo rápido
      # (tauri.rapido.json y un perfil sin LTO), que prueba lo mismo en un
      # tercio del tiempo: medido, comprimir eran 8 min y compilar 3.
      PUBLICAR: ${{ startsWith(github.ref, 'refs/tags/v') || (inputs.etiqueta || '') != '' }}
      # El perfil de Cargo de cada modo, aquí y no dentro del paso: así la caché
      # de Rust de cada modo es distinta. Con una sola, el modo rápido recuperaba
      # la compilada con LTO, la daba por buena («Cache up-to-date», sin
      # guardar) y recompilaba las 285 dependencias cada vez.
      CARGO_PROFILE_RELEASE_LTO: ${{ (startsWith(github.ref, 'refs/tags/v') || (inputs.etiqueta || '') != '') && 'true' || 'false' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ (startsWith(github.ref, 'refs/tags/v') || (inputs.etiqueta || '') != '') && '1' || '16' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          # Con el botón, la etiqueta recién creada; si no, lo que se ha empujado.
          ref: ${{ inputs.etiqueta || github.ref }}
          # Con la historia entera: las notas de la versión listan los cambios
          # desde la anterior.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # Las descargas pesan ~500 MB (LibreOffice son 373). Se guardan por la
      # suma del script: cambiar una versión en él invalida la caché.
      # vendor\ ya preparado, no sólo las descargas: extraer LibreOffice,
      # recortarlo y sacar Pango de MSYS2 eran 3-3,5 minutos en cada ejecución.
      # Se rehace sólo cuando cambia el script. Restaurar y guardar van por
      # separado porque vendor\ se mueve a dist\ más abajo, y la caché de
      # siempre, que guarda al final, ya no lo encontraría.
      - name: Recuperar vendor
        id: vendor
        uses: actions/cache/restore@v6
        with:
          path: escritorio/vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('escritorio/scripts/traer-dependencias.ps1') }}

      - uses: actions/cache@v6
        if: steps.vendor.outputs.cache-hit != 'true'
        with:
          path: escritorio/descargas
          key: descargas-${{ hashFiles('escritorio/scripts/traer-dependencias.ps1') }}

      - name: Preparar vendor
        if: steps.vendor.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: ./escritorio/scripts/traer-dependencias.ps1

      - name: Guardar vendor
        if: steps.vendor.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: escritorio/vendor
          key: ${{ steps.vendor.outputs.cache-primary-key }}

      - name: Lo que hay en vendor responde
        run: |
          $vendor = (Resolve-Path escritorio\vendor).Path
          $env:TESSDATA_PREFIX = "$vendor\tesseract\tessdata"
          & "$vendor\tesseract\tesseract.exe" --version
          & "$vendor\tesseract\tesseract.exe" --list-langs
          & "$vendor\gs\bin\gswin64c.exe" --version
          & "$vendor\libreoffice\program\soffice.exe" --version
          Get-ChildItem "$vendor\letras" | Select-Object -ExpandProperty Name
          Get-Content "$vendor\VERSIONES.txt"

      - name: Dependencias de Python
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-escritorio.txt -r requirements-dev.txt

      # Con el Pango y las letras de vendor\, que son los que se reparten. Sin
      # decírselo, WeasyPrint los busca en C:\msys64\mingw64\bin, y eso sólo
      # funcionaba porque preparar vendor instalaba Pango ahí de paso: con
      # vendor\ sacado de la caché, no hay nada. Las letras no hace falta
      # decírselas: fontconfig lee vendor\gtk\etc\fonts\fonts.conf solo.
      - name: Tests
        id: tests
        continue-on-error: true
        working-directory: backend
        run: |
          $env:WEASYPRINT_DLL_DIRECTORIES = (Resolve-Path ..\escritorio\vendor\gtk\bin).Path
          python -m pytest tests/ -q -p no:cacheprovider -rf

      # Arrancar y barrer en el **mismo** paso: en Windows el runner mata todo
      # lo que un paso haya lanzado en cuanto ese paso acaba, así que un backend
      # arrancado en un paso ya no existe en el siguiente.
      - name: Pasada por todas las herramientas
        id: barrido
        continue-on-error: true
        working-directory: backend
        run: |
          $env:ESCRITORIO_TOKEN = 'ci'
          $env:ESCRITORIO_VENDOR = '..\escritorio\vendor'
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\datos"
          $backend = Start-Process python -ArgumentList 'escritorio.py' -NoNewWindow -PassThru `
            -RedirectStandardOutput "$env:RUNNER_TEMP\salida.txt" `
            -RedirectStandardError "$env:RUNNER_TEMP\errores.txt"
          foreach ($i in 1..120) {
            $linea = Get-Content "$env:RUNNER_TEMP\salida.txt" -ErrorAction SilentlyContinue |
              Select-String 'LISTO (\d+)'
            if ($linea -or $backend.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $linea) { throw 'El backend no ha dicho LISTO en un minuto.' }
          $env:BASE = "http://127.0.0.1:$($linea.Matches[0].Groups[1].Value)"
          $env:TOKEN = 'ci'
          # Sólo para la salida del barrido (✓ y ✗): la consola de Windows es
          # cp1252. Al backend no se le pone, para que se vea si depende de ello.
          $env:PYTHONIOENCODING = 'utf-8'
          python ..\scripts\barrido.py
          $resultado = $LASTEXITCODE
          Stop-Process -Id $backend.Id -Force -ErrorAction SilentlyContinue
          exit $resultado

      - name: Registro del backend
        if: always()
        run: Get-Content "$env:RUNNER_TEMP\errores.txt" -ErrorAction SilentlyContinue | Select-Object -Last 200

      # --- El mismo backend, empaquetado con PyInstaller -----------------------
      #
      # El paquete lleva dentro el Angular compilado (lo sirve él mismo), así
      # que hay que compilarlo antes.
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar el frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Empaquetar el backend
        working-directory: escritorio
        run: |
          pyinstaller backend.spec --noconfirm
          # Como quedará instalado: vendor\ al lado de la carpeta del backend.
          # Así se prueba también que el .exe lo encuentra solo, sin
          # ESCRITORIO_VENDOR.
          Move-Item vendor dist\vendor

      # Lo mismo que antes, pero contra el .exe: es lo que recibe quien lo
      # instala, y lo que sólo falla empaquetado —un plugin que se carga por
      # nombre, un archivo de datos que PyInstaller no ve— sólo sale aquí.
      - name: Pasada por todas las herramientas (empaquetado)
        id: empaquetado
        continue-on-error: true
        run: |
          $env:ESCRITORIO_TOKEN = 'ci'
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\datos-exe"
          $exe = 'escritorio\dist\merge-pdf-backend\merge-pdf-backend.exe'
          $backend = Start-Process $exe -NoNewWindow -PassThru `
            -RedirectStandardOutput "$env:RUNNER_TEMP\salida-exe.txt" `
            -RedirectStandardError "$env:RUNNER_TEMP\errores-exe.txt"
          foreach ($i in 1..240) {
            $linea = Get-Content "$env:RUNNER_TEMP\salida-exe.txt" -ErrorAction SilentlyContinue |
              Select-String 'LISTO (\d+)'
            if ($linea -or $backend.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $linea) { throw 'El backend empaquetado no ha dicho LISTO en dos minutos.' }
          $env:BASE = "http://127.0.0.1:$($linea.Matches[0].Groups[1].Value)"
          $env:TOKEN = 'ci'
          $env:PYTHONIOENCODING = 'utf-8'
          # La página también: el paquete sirve el frontend.
          $pagina = Invoke-WebRequest "$env:BASE/?t=ci" -SessionVariable s
          if ($pagina.Content -notmatch 'app-root') { throw 'El paquete no sirve el frontend.' }
          python scripts\barrido.py
          $resultado = $LASTEXITCODE
          Stop-Process -Id $backend.Id -Force -ErrorAction SilentlyContinue
          exit $resultado

      - name: Registro del backend empaquetado
        if: always()
        run: Get-Content "$env:RUNNER_TEMP\errores-exe.txt" -ErrorAction SilentlyContinue | Select-Object -Last 200

      # --- El instalador -------------------------------------------------------
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: escritorio/src-tauri
          # Una caché por modo (ver CARGO_PROFILE_RELEASE_* arriba).
          key: publicar-${{ env.PUBLICAR }}

      # Lo que decide qué se pone y qué se quita al aplicar un paquete de
      # actualización. Sólo usa std, así que se prueba con rustc suelto, sin
      # compilar Tauri para los tests.
      - name: Tests del plan de actualización
        run: |
          rustc --edition 2021 --test escritorio\src-tauri\src\parche_plan.rs -o "$env:RUNNER_TEMP\parche_plan.exe"
          if ($LASTEXITCODE) { throw 'No compila.' }
          & "$env:RUNNER_TEMP\parche_plan.exe"
          if ($LASTEXITCODE) { throw 'Fallan los tests del plan de actualización.' }

      - name: Compilar el instalador
        id: instalador
        working-directory: escritorio
        run: |
          npm ci
          if ($env:PUBLICAR -eq 'true') {
            npx tauri build
          } else {
            # Modo rápido: sin comprimir (src-tauri/tauri.rapido.json, que se
            # aplica encima de tauri.conf.json) y sin LTO (el perfil va en el
            # entorno del trabajo). Lo que se instala es igual; sólo cambia cómo
            # va empaquetado.
            npx tauri build --config src-tauri/tauri.rapido.json
          }
          $nsis = Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          '{0}: {1:N0} MB' -f $nsis.Name, ($nsis.Length / 1MB)
          "ruta=$($nsis.FullName)" >> $env:GITHUB_OUTPUT

      # --- Paquetes de actualización -------------------------------------------
      #
      # El manifiesto de esta versión (cada archivo que pone el instalador, con
      # su SHA-256) y, al publicar, un paquete con sólo lo que cambia desde cada
      # una de las últimas versiones (escritorio/scripts/paquetes.py; los aplica
      # la aplicación, src-tauri/src/parche.rs). Una versión normal son unos MB
      # en vez de los ~310 del instalador.
      #
      # En cada push, el manifiesto y un paquete contra sí mismo, que tiene que
      # salir vacío: así el script se prueba en Windows sin esperar a publicar.
      # El manifiesto lo usa también la prueba de aplicar de más abajo.
      - name: Paquetes de actualización
        id: paquetes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content escritorio\src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory paquetes, anteriores -Force | Out-Null
          python escritorio\scripts\paquetes.py manifiesto --version $version --salida paquetes\archivos.json
          if ($LASTEXITCODE) { throw 'No se ha podido hacer el manifiesto.' }
          if ($env:PUBLICAR -ne 'true') {
            python escritorio\scripts\paquetes.py paquete --viejo paquetes\archivos.json --nuevo paquetes\archivos.json --salida anteriores
            $vacio = Get-ChildItem anteriores\*.tar.gz | Select-Object -First 1
            python -c "import sys, tarfile; sys.exit(tarfile.open(sys.argv[1]).getnames() != ['cambios.json'])" $vacio.FullName
            if ($LASTEXITCODE) { throw 'El paquete de una versión contra sí misma no sale vacío.' }
            'El paquete contra sí misma sale vacío.'
            exit 0
          }
          # Desde las últimas versiones publicadas que tengan manifiesto. Si el
          # instalador ha cambiado desde alguna (paquetes.py, huella), desde ésa
          # no hay paquete: sólo NSIS sabe aplicar esos cambios.
          $etiqueta = '${{ inputs.etiqueta || github.ref_name }}'
          gh api "repos/${{ github.repository }}/releases?per_page=100" > releases.json
          $desde = @(Get-Content releases.json -Raw | python escritorio\scripts\paquetes.py anteriores --actual $etiqueta) |
            Where-Object { $_ }
          if ($LASTEXITCODE) { throw 'No se han podido leer las versiones anteriores.' }
          if (-not $desde) { 'Ninguna versión anterior tiene manifiesto: esta sale sin paquetes.' }
          foreach ($anterior in $desde) {
            gh release download $anterior --pattern archivos.json --output "anteriores\$anterior.json"
            if ($LASTEXITCODE) { throw "No se ha podido bajar el manifiesto de $anterior." }
            python escritorio\scripts\paquetes.py paquete --viejo "anteriores\$anterior.json" --nuevo paquetes\archivos.json --salida paquetes
            if ($LASTEXITCODE) { throw "No se ha podido hacer el paquete desde $anterior." }
          }
          # Con la misma clave que el instalador: la aplicación comprueba la
          # firma con la pública de tauri.conf.json antes de abrir el paquete.
          Push-Location escritorio
          foreach ($paquete in Get-ChildItem ..\paquetes\*.tar.gz) {
            npx tauri signer sign $paquete.FullName
            if ($LASTEXITCODE) { throw "No se ha podido firmar $($paquete.Name)." }
          }
          Pop-Location

      # Instalado de verdad, como lo haría alguien: que el backend arranque desde
      # la carpeta de instalación (encuentra vendor\ solo) y, sobre todo, que
      # **muera con la aplicación aunque se la cierre de golpe**. Es lo que
      # garantiza el job object de main.rs; sin él quedarían un Python y quizá
      # un LibreOffice vivos y sin ventana.
      - name: Instalar, abrir y cerrar de golpe
        id: instalado
        continue-on-error: true
        run: |
          $proceso = Start-Process '${{ steps.instalador.outputs.ruta }}' -ArgumentList '/S' -PassThru -Wait
          if ($proceso.ExitCode -ne 0) { throw "El instalador salió con $($proceso.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Caja de herramientas" -Filter 'caja-de-herramientas.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'No aparece la aplicación instalada.' }
          "Instalada en $($exe.DirectoryName)"
          $registro = "$env:LOCALAPPDATA\merge-pdf\backend.log"
          # Con la autoprueba del puente (src-tauri/src/autoprueba.js): la página
          # comprueba que llega a los comandos y deja aquí lo que ha visto.
          $autoprueba = "$env:RUNNER_TEMP\autoprueba.json"
          $env:CAJA_AUTOPRUEBA = $autoprueba
          $app = Start-Process $exe.FullName -PassThru
          foreach ($i in 1..240) {
            if ((Test-Path $registro) -and (Select-String -Path $registro -Pattern 'listo con \d+ rutas' -Quiet)) { break }
            if ($app.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }
          Get-Content $registro -ErrorAction SilentlyContinue | Select-Object -Last 20
          if (-not (Select-String -Path $registro -Pattern 'listo con \d+ rutas' -Quiet)) {
            throw 'El backend de la aplicación instalada no ha arrancado.'
          }
          $backend = Get-Process merge-pdf-backend -ErrorAction SilentlyContinue
          if (-not $backend) { throw 'No hay proceso del backend.' }
          # La prioridad baja la pone el job de src/trabajo.rs: si está, el job
          # (con su tope de memoria) se ha aplicado.
          if ($backend.PriorityClass -ne 'BelowNormal') {
            throw "El backend corre con prioridad $($backend.PriorityClass): el job no se ha aplicado."
          }
          'El backend está en su job: prioridad baja y tope de memoria.'

          # La página tiene que poder llamar a los comandos de la aplicación.
          # Durante tres versiones no pudo («not allowed by ACL») y «Guardar» y
          # «Abrir con…» fallaron en silencio sin que nada lo detectara. Se mira
          # desde dentro porque el WebView2 de la CI no abre el puerto de
          # depuración (en una VM sí: escritorio/scripts/comprobar-puente.js).
          foreach ($i in 1..60) { if (Test-Path $autoprueba) { break }; Start-Sleep 1 }
          if (-not (Test-Path $autoprueba)) {
            throw 'La autoprueba no ha llegado: la página no tiene puente con Tauri o no ha cargado.'
          }
          $r = Get-Content $autoprueba -Raw | ConvertFrom-Json
          $r | ConvertTo-Json -Depth 4
          $version = (Get-Content escritorio\src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $fallos = @()
          if ($r.version.ok -ne $version) { $fallos += "versión: $($r.version | ConvertTo-Json -Compress)" }
          if ($r.pendientes.error) { $fallos += "archivos_pendientes: $($r.pendientes.error)" }
          if ($r.leer.error -notmatch 'no se ha abierto con la aplicaci') { $fallos += "leer_archivo: $($r.leer | ConvertTo-Json -Compress)" }
          if ($r.menu.error) { $fallos += "menu_contextual: $($r.menu.error)" }
          if ($r.actualizacion.error) { $fallos += "actualizacion_pendiente: $($r.actualizacion.error)" }
          if ($r.ajustes.error -or -not $r.ajustes.ok.ajustes.avisos) { $fallos += "leer_ajustes: $($r.ajustes | ConvertTo-Json -Compress -Depth 5)" }
          if ($fallos) { throw ("El puente con Tauri no funciona:`n - " + ($fallos -join "`n - ")) }
          'El puente con Tauri funciona: la página llega a los comandos de la aplicación.'
          # De golpe, como el Administrador de tareas: sin dar ocasión a cerrar
          # nada por las buenas.
          Stop-Process -Id $app.Id -Force
          Start-Sleep -Seconds 3
          $vivo = Get-Process merge-pdf-backend -ErrorAction SilentlyContinue
          if ($vivo) { throw 'El backend sigue vivo después de matar la aplicación.' }
          'El backend ha muerto con la aplicación.'

          # «Abrir con…»: en la lista de los PDF, pero sin ser el predeterminado.
          $lista = Get-ItemProperty 'HKCU:\Software\Classes\.pdf\OpenWithProgids' -ErrorAction SilentlyContinue
          if (-not ($lista.PSObject.Properties.Name -contains 'CajaDeHerramientas.Archivo')) {
            throw 'La aplicación no aparece en «Abrir con…» de los PDF.'
          }
          $predeterminado = (Get-ItemProperty 'HKCU:\Software\Classes\.pdf' -ErrorAction SilentlyContinue).'(default)'
          if ($predeterminado -eq 'CajaDeHerramientas.Archivo') {
            throw 'La aplicación se ha hecho programa predeterminado de los PDF.'
          }
          'En «Abrir con…» de los PDF, sin ser el predeterminado.'

          # Una actualización por paquete, aplicada por la propia aplicación
          # (src/parche.rs) sobre lo recién instalado: trae un archivo nuevo, y
          # uno que sobra tiene que desaparecer. Sin descarga ni firma, que se
          # prueban en una VM. Lo que se prueba aquí es que el manifiesto
          # coincide con lo que pone el instalador —si no, se niega por «falta
          # un archivo»—, el cambio de archivos y la versión en el registro.
          $instalacion = $exe.DirectoryName
          $prueba = "$env:LOCALAPPDATA\merge-pdf\actualizacion\9.9.9-1"
          $nuevo = 'backend/_internal/frontend/prueba-de-paquete.txt'
          New-Item -ItemType Directory "$prueba\nuevos\backend\_internal\frontend" -Force | Out-Null
          Set-Content "$prueba\nuevos\backend\_internal\frontend\prueba-de-paquete.txt" 'nuevo' -NoNewline
          Set-Content "$instalacion\backend\_internal\frontend\resto-de-otra-version.js" 'viejo'
          $manifiesto = (Get-Content paquetes\archivos.json -Raw | ConvertFrom-Json -AsHashtable).archivos
          # Lo que haya en la instalación y no en el manifiesto se borra al
          # aplicar. Si sale algo más que el resto puesto a mano, es que la
          # aplicación escribe en su carpeta y el barrido se lo llevaría.
          $sobran = Get-ChildItem "$instalacion\backend", "$instalacion\vendor" -Recurse -File |
            ForEach-Object { $_.FullName.Substring($instalacion.Length + 1).Replace('\', '/') } |
            Where-Object { -not $manifiesto.ContainsKey($_) }
          "Sobran antes de aplicar: $($sobran -join ', ')"
          @{
            formato = 1; desde = $version; hasta = '9.9.9'; borrar = @()
            archivos = @{ $nuevo = (Get-FileHash "$prueba\nuevos\backend\_internal\frontend\prueba-de-paquete.txt").Hash.ToLower() }
            todos = @($manifiesto.Keys) + $nuevo
          } | ConvertTo-Json -Depth 4 | Set-Content "$prueba\cambios.json" -Encoding utf8NoBOM
          $aplicar = Start-Process $exe.FullName -PassThru -Wait -ArgumentList `
            '--aplicar-actualizacion', "`"$prueba`"", '--instalacion', "`"$instalacion`"", '--sin-abrir'
          Get-Content "$env:LOCALAPPDATA\merge-pdf\actualizacion\resultado.json" -ErrorAction SilentlyContinue
          if ($aplicar.ExitCode -ne 0) { throw "Aplicar el paquete ha salido con $($aplicar.ExitCode)." }
          if ((Get-Content "$instalacion\backend\_internal\frontend\prueba-de-paquete.txt" -Raw) -ne 'nuevo') {
            throw 'El archivo del paquete no está en su sitio.'
          }
          if (Test-Path "$instalacion\backend\_internal\frontend\resto-de-otra-version.js") { throw 'Lo que sobraba sigue ahí.' }
          $registrada = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
            Get-ItemProperty | Where-Object { $_.DisplayVersion -eq '9.9.9' }
          if (-not $registrada) { throw 'La versión en el registro no ha cambiado.' }
          'Paquete aplicado: lo nuevo en su sitio, lo que sobraba fuera y la versión en el registro.'

          # Y al desinstalar no queda nada: ni en el registro ni en la carpeta,
          # tampoco lo que llegó con el paquete, que la plantilla de NSIS no
          # conoce (lo borra el gancho de windows/ganchos.nsh).
          $desinstalador = Join-Path $instalacion 'uninstall.exe'
          Start-Process $desinstalador -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path 'HKCU:\Software\Classes\CajaDeHerramientas.Archivo') {
            throw 'Desinstalada, sigue registrada en «Abrir con…».'
          }
          if (Test-Path $instalacion) {
            Get-ChildItem $instalacion -Recurse | Select-Object -First 20 -ExpandProperty FullName
            throw 'Desinstalada, la carpeta de la aplicación sigue ahí.'
          }
          'Desinstalada sin dejar rastro en el registro ni en la carpeta.'

      - uses: actions/upload-artifact@v7
        id: artefacto
        if: steps.instalador.outcome == 'success'
        with:
          name: instalador-windows
          path: ${{ steps.instalador.outputs.ruta }}
          # Al publicar ya va comprimido con LZMA y recomprimirlo sólo gasta
          # tiempo; el del modo rápido va sin comprimir, y una pasada ligera lo
          # deja en algo razonable para descargarlo.
          compression-level: ${{ env.PUBLICAR == 'true' && '0' || '1' }}
          retention-days: 14

      # --- Firma de código (SignPath) --------------------------------------------
      #
      # Sólo si está dado de alta (el secreto existe). SignPath descarga el
      # artefacto, lo firma con el certificado de SignPath Foundation y lo
      # devuelve. Firmar cambia los bytes del instalador, así que después hay
      # que volver a firmarlo para el actualizador.
      - name: Firmar con SignPath
        id: firma
        if: env.SIGNPATH_API_TOKEN != '' && steps.artefacto.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.artefacto.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: firmado

      - name: El instalador firmado sustituye al otro
        if: steps.firma.outcome == 'success'
        run: |
          $firmado = Get-ChildItem firmado\*.exe | Select-Object -First 1
          Copy-Item $firmado.FullName '${{ steps.instalador.outputs.ruta }}' -Force
          Push-Location escritorio
          npx tauri signer sign '${{ steps.instalador.outputs.ruta }}'
          Pop-Location

      - name: Tamaño
        if: always()
        run: |
          foreach ($carpeta in Get-ChildItem escritorio\dist -Directory -ErrorAction SilentlyContinue) {
            $mb = (Get-ChildItem $carpeta.FullName -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
            '{0,-20} {1,6:N0} MB' -f $carpeta.Name, $mb
          }

      - name: Resultado
        if: always() && (steps.tests.outcome != 'success' || steps.barrido.outcome != 'success' || steps.empaquetado.outcome != 'success' || steps.instalado.outcome != 'success')
        run: |
          echo "Tests: ${{ steps.tests.outcome }} · Barrido: ${{ steps.barrido.outcome }} · Empaquetado: ${{ steps.empaquetado.outcome }} · Instalado: ${{ steps.instalado.outcome }}"
          exit 1

      # --- Publicar la versión ---------------------------------------------------
      #
      # Sólo con una etiqueta `v*`, y sólo si todo lo anterior ha pasado: el paso
      # «Resultado» corta aquí si algo ha fallado.
      - name: Publicar la versión
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.etiqueta || '') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $etiqueta = '${{ inputs.etiqueta || github.ref_name }}'
          $version = (Get-Content escritorio\src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($etiqueta -ne "v$version") {
            throw "La etiqueta es $etiqueta pero tauri.conf.json dice ${version}: sube la versión antes de etiquetar."
          }
          # Sin espacios: GitHub los cambia por puntos al subirlo, y la URL de
          # latest.json dejaría de apuntar al archivo.
          $nombre = "CajaDeHerramientas_${version}_x64-setup.exe"
          Copy-Item '${{ steps.instalador.outputs.ruta }}' $nombre
          $firma = Get-Content '${{ steps.instalador.outputs.ruta }}.sig' -Raw
          # Las novedades: los commits desde la versión anterior, pero sólo los
          # que cuentan algo a quien la usa, `feat` y `fix`. Desde que la
          # aplicación vive en `master` entran también los de documentación, CI
          # y despliegue de la web, que no le dicen nada. Sin prefijo ni ámbito:
          # «feat(escritorio): varias ventanas» sale como «Varias ventanas».
          #
          # Es lo que lee la gente: en la página de la release y en el aviso de
          # actualización de la aplicación, que las pide a GitHub
          # (`frontend/src/app/core/novedades.ts` entiende este formato).
          $anterior = git describe --tags --abbrev=0 "$etiqueta^" 2>$null
          $rango = if ($anterior) { "$anterior..$etiqueta" } else { $etiqueta }
          $patron = '^(feat|fix)(\([^)]*\))?!?:\s*(.+)$'
          $novedades = @(); $arreglos = @()
          foreach ($asunto in git log --no-merges --format='%s' $rango) {
            if ($asunto -match $patron) {
              $texto = $Matches[3].Substring(0, 1).ToUpper() + $Matches[3].Substring(1)
              if ($Matches[1] -eq 'feat') { $novedades += "- $texto" } else { $arreglos += "- $texto" }
            }
          }
          $desde = if ($anterior) { " desde $anterior" } else { '' }
          $cambios = @(
            if ($novedades) { "## Novedades$desde"; ''; $novedades; '' }
            if ($arreglos) { "## Arreglos$desde"; ''; $arreglos; '' }
            if (-not $novedades -and -not $arreglos) { 'Mejoras internas y de rendimiento.' }
          ) -join "`n"
          # Los paquetes con sólo lo que cambia (paso «Paquetes de
          # actualización»), por la versión desde la que sirven. El actualizador
          # de Tauri no mira este campo; lo lee la aplicación (src/parche.rs).
          $paquetes = @{}
          $tamanos = @()
          foreach ($paquete in Get-ChildItem paquetes\*.tar.gz) {
            $desde = $paquete.Name -replace '^CajaDeHerramientas-cambios-desde-(.+)\.tar\.gz$', '$1'
            $paquetes[$desde] = @{
              url = "https://github.com/${{ github.repository }}/releases/download/$etiqueta/$($paquete.Name)"
              firma = (Get-Content "$($paquete.FullName).sig" -Raw).Trim()
              tamano = $paquete.Length
            }
            $tamanos += '- Desde la {0}: {1:N1} MB' -f $desde, ($paquete.Length / 1MB)
          }
          # Lo que lee el actualizador de las instalaciones que ya hay. `notes`
          # lleva las novedades de esta versión: el aviso las enseña si no puede
          # pedir a GitHub las de todas las versiones que se ha saltado.
          @{
            version = $version
            notes = $cambios.Trim()
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{
                signature = $firma.Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/$etiqueta/$nombre"
              }
            }
            paquetes = $paquetes
          } | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8NoBOM
          $firmado = if ('${{ steps.firma.outcome }}' -eq 'success') { 'Firmado con SignPath.' } else {
            'Todavía **sin firmar**: Windows avisará al abrirlo («Más información» → «Ejecutar de todas formas»).' }
          # Y una copia con nombre fijo, para que haya un enlace que no cambie
          # nunca: releases/latest/download/CajaDeHerramientas-setup.exe lleva
          # siempre a la última. Es el que se enlaza desde el README de master.
          Copy-Item $nombre 'CajaDeHerramientas-setup.exe'
          $actualizar = if ($tamanos) {
            @('', '### Lo que se descarga al actualizar desde la aplicación', '') + $tamanos + @('',
              'Desde una versión más antigua, el instalador completo.') } else { @() }
          $notas = (@('Instalador para Windows 10 y 11 (64 bits). ' + $firmado, '', $cambios) + $actualizar) -join "`n"
          # El manifiesto se sube siempre: sin él, la versión siguiente no
          # podría hacer paquete desde ésta. Las firmas de los paquetes ya van
          # en latest.json.
          $recursos = @($nombre, 'CajaDeHerramientas-setup.exe', 'latest.json', 'paquetes\archivos.json') +
            @(Get-ChildItem paquetes\*.tar.gz | ForEach-Object FullName)
          gh release create $etiqueta @recursos --title "Caja de herramientas $version" --notes $notas
          if ($LASTEXITCODE) { throw 'No se ha podido crear la release.' }

          # Los paquetes de las releases anteriores ya no los enlaza nadie
          # (latest.json es el de ésta): se borran para que no se queden
          # ocupando sitio. Se quedan su instalador y su manifiesto.
          gh api "repos/${{ github.repository }}/releases?per_page=100" |
            python escritorio\scripts\paquetes.py podar --ultima $etiqueta |
            ForEach-Object {
              $release, $recurso = $_ -split "`t"
              gh release delete-asset $release $recurso --yes
              "Quitado $recurso de $release"
            }
